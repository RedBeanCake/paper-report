    <script type="text/markdown" id="raw-markdown">### 1. 🔥 [QQWorld (原文未提供完整标题)](https://arxiv.org/abs/2607.28415) (QQWorld：基于分位数匹配的世界模型潜变量正则化方法)
- **研究机构**: `（原文未明确）`
- **Arxiv ID**: `2607.28415` | [点击跳转](https://arxiv.org/abs/2607.28415)

**领域与类型判断**：本文属于**强化学习/世界模型**领域，是一篇**方法创新**论文。主要解决隐空间世界模型在表示学习时的分布正则化问题。

**0. 论文标题**
- **英文标题**: QQWorld (原文未提供完整标题)
- **中文标题**: QQWorld：基于分位数匹配的世界模型潜变量正则化方法
- **研究机构**: （原文未明确）
- **一句话总结**: 用分位数-分位数（QQ）匹配目标替换 Epps-Pulley (EP) 目标，解决隐空间世界模型潜变量分布尾部正则化失效的问题，提升了下游规划任务的成功率。

**1. 整体逻辑**
- **研究任务**: 提升隐空间世界模型（Latent world models）学到的潜变量（latent）分布质量，从而改善基于该模型的规划（planning）性能。
- **研究动机**: 现有的 LeWorldModel (LeWM) 用 Epps-Pulley (EP) 目标把潜变量正则化为各向同性高斯分布。但作者发现，EP 产生的校正梯度在孤立的尾部样本上会迅速消失，导致分布的重尾偏差（heavy-tailed deviations）得不到有效控制。
- **本质改动**: 抛弃 EP 目标，改用分位数-分位数（QQ）匹配目标。通过直接对齐潜变量样本和高斯分位数，确保在分布尾部依然有足够大、足够有效的校正梯度。
- **技术溯源**: 基于 LeWorldModel (LeWM) 框架和 Epps-Pulley (EP) 统计检验。

**2. 技术拆解**
- **核心方法**: 
  1. **QQ 匹配正则化**：计算潜变量投影样本的排序，将其与理论高斯分布的对应分位数直接对齐。
  2. **Cross-batch QQ**：为了增加排序的样本量，把历史 batch 的隐变量（做 detach 处理阻断梯度）拿过来一起算排序，扩大有效排序池（ranking pool），并理论分析了这种跨 batch 操作的偏差-方差权衡（bias-variance trade-off）。
- **关键细节**: 
  - 输入输出：输入为环境交互的状态/动作序列，输出为预测的潜变量。
  - 模型结构与超参：（原文未明确具体网络结构、潜变量维度及 cross-batch 的历史窗口大小等细节）。
- **训练/优化目标**: 核心优化目标是 QQ 匹配损失（Quantile-Quantile matching objective），用于替代原有的 EP 目标，强制潜变量分布严格贴合标准高斯分布，重点压制尾部。

**3. 实验结果**
- **实验设置**: 在 4 个控制环境（control environments）中评估。Baseline 为原版使用 EP 目标的 LeWM。（原文未明确具体是哪 4 个环境，如 DeepMind Control Suite 等）。
- **评价指标**: 平均规划成功率（average planning success rate）；潜变量分布的高斯对齐度（Gaussian alignment）和尾部厚度（latent tails）。
- **主要结果**: 相比 LeWM，QQWorld 有效提高了平均规划成功率；在分布层面，潜变量尾部更薄，高斯对齐效果更好，验证了 QQ 匹配确实解决了尾部失控的问题。
