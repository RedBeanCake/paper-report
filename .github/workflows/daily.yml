name: Paper Report (manual only)

on:
  workflow_dispatch:
    inputs:
      papers:
        description: '输入需要深度解析的内容：arXiv ID（如 2602.10116）或链接（arxiv / 任意网页 URL），多个用逗号或换行分隔'
        required: false
        default: ''
      chat_id:
        description: '（可选）解析完成后要把报告推送到哪个飞书群的 chat_id，留空则用仓库默认配置'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 openai

      - name: Run Scraper
        timeout-minutes: 15
        env:
          PAPERS: ${{ github.event.inputs.papers }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push origin main

      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
